name: Compiler le plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: jellyfin-12
            jellyfin: "12.0.0"
            dotnet: "10.0.x"
          - label: jellyfin-10.11
            jellyfin: "10.11.0"
            dotnet: "9.0.x"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Compiler
        run: >
          dotnet publish Jellyfin.Plugin.SeriesSubtitles -c Release
          -p:JellyfinVersion=${{ matrix.jellyfin }}
          -o out/SeriesSubtitles_1.0.0.0

      - name: Ne garder que la DLL du plugin
        run: find out -type f ! -name 'Jellyfin.Plugin.SeriesSubtitles.dll' -delete

      - uses: actions/upload-artifact@v4
        with:
          name: SeriesSubtitles-${{ matrix.label }}
          path: out
